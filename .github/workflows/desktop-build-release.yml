name: .NET & Tauri Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release tag name (e.g. v1.0.0)'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Desktop Apps
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Verify Tag is on Master Branch
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        git fetch origin master
        $containsMaster = git branch -r --contains ${{ github.sha }} | Select-String "origin/master"
        if (-not $containsMaster) {
          Write-Error "Error: Tag was not cut from the master branch. Aborting release."
          exit 1
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore AudioExtractor.sln

    - name: Build Solution
      run: dotnet build AudioExtractor.sln --configuration Release --no-restore

    - name: Publish WPF GUI (Self-Contained win-x64)
      run: |
        dotnet publish AudioExtractor/AudioExtractor.csproj `
          --configuration Release `
          --output ./publish/gui `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true

    - name: Publish CLI (Self-Contained win-x64)
      run: |
        dotnet publish AudioExtractor.Cli/AudioExtractor.Cli.csproj `
          --configuration Release `
          --output ./publish/cli `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true

    - name: Zip Artifacts (GUI & CLI)
      shell: powershell
      run: |
        Compress-Archive -Path ./publish/gui/* -DestinationPath ./AudioExtractor-GUI-win-x64.zip
        Compress-Archive -Path ./publish/cli/* -DestinationPath ./AudioExtractor-CLI-win-x64.zip

    - name: Upload GUI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AudioExtractor-GUI-win-x64
        path: ./AudioExtractor-GUI-win-x64.zip

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AudioExtractor-CLI-win-x64
        path: ./AudioExtractor-CLI-win-x64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
        files: |
          ./AudioExtractor-GUI-win-x64.zip
          ./AudioExtractor-CLI-win-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    name: Build & Package Tauri Companion
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: |
          cd AudioExtractor.Tauri
          npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.release_tag || github.ref_name }}
          releaseName: 'Audio Extractor ${{ github.event.inputs.release_tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          projectPath: './AudioExtractor.Tauri'
